<!DOCTYPE html>
<html lang="ko">
<head>
    <!--
      새 페이지 시작 템플릿
      1) 이 파일을 저장소 루트로 복사하고 파일명을 바꿉니다. (예: about.html)
      2) title, description, 본문(main)만 수정합니다.
      3) 공통 헤더·푸터·메뉴는 js/common.js가 자동으로 넣어 줍니다.
         메뉴에 새 페이지를 추가해야 하면 js/common.js의 NAV_ITEMS를 수정합니다.
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="페이지 설명을 입력하세요">
    <title>활동 기록 | D팀</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- 페이지 전용 스타일이 필요하면 css/페이지이름.css를 만들어 아래에 추가 -->
     <link rel="stylesheet" href="css/activities.css">
</head>
<body>
    <div id="site-header"></div>

    <main id="main">
        <div class="container">
            <h1 class="page-title">활동 기록</h1>
            <p class="page-desc">주차를 선택해 세부 활동 항목을 클릭하면 오른쪽 영역에서 상세 내용을 확인할 수 있습니다.</p>

            <!-- 여기에 내용을 작성하세요 -->

            <div class="activity-layout">
                <aside id="activity-sidebar" class="card activity-sidebar" aria-label="주차별 활동 목록"></aside>
                <section id="activity-viewer" class="card activity-viewer" aria-live="polite"></section>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>
    <script src="js/common.js"></script>
    <script src="js/activities.js"></script>
</body>
</html>

name: "📝 일반 작업"
description: "문서 작성, 테스트, 정리 등 일반 작업을 등록합니다."
title: "[TASK] "
labels: ["task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 작업 목적
      description: 무엇을 위해 필요한 작업인가요?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 작업 내용
      description: 수행할 작업을 구체적으로 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 작업 완료 여부를 판단할 기준을 작성해주세요.
      placeholder: |
        - [ ] 변경 사항을 확인함
        - [ ] 관련 문서를 업데이트함
    validations:
      required: true
  - type: input
    id: assignee_hint
    attributes:
      label: 담당자(선택)
      placeholder: GitHub 사용자 이름
    validations:
      required: false

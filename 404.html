<!DOCTYPE html>
<html lang="ko">
<head>
    <!--
      GitHub Pages가 없는 주소로 접속했을 때 보여 주는 페이지입니다.
      어떤 주소(폴더 깊이)에서 열려도 CSS·JS·링크가 깨지지 않도록 <base>로 기준 경로를 지정합니다.
      저장소 이름이 바뀌면 아래 base의 href도 함께 바꿔야 합니다.
    -->
    <base href="/oss-team-portfolio/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>페이지를 찾을 수 없습니다 | D팀</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/not-found.css">
</head>
<body>
    <div id="site-header"></div>

    <main id="main">
        <div class="container">
            <section class="nf">
                <p class="nf-code" aria-hidden="true">404</p>
                <h1 class="nf-title">페이지를 찾을 수 없습니다</h1>
                <p class="nf-desc">주소가 잘못되었거나, 아직 개발 중인 페이지일 수 있어요.</p>

                <div class="nf-terminal" aria-hidden="true">
                    <p><span class="prompt">$</span> cd page</p>
                    <p class="nf-error">bash: cd: page: No such file or directory</p>
                </div>

                <div class="nf-actions">
                    <a class="nf-btn nf-btn-primary" href="index.html">홈으로 돌아가기</a>
                    <a class="nf-btn" href="projects.html">프로젝트 보기</a>
                </div>
            </section>
        </div>
    </main>

    <div id="site-footer"></div>
    <script src="js/common.js"></script>
</body>
</html>

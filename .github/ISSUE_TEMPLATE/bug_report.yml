name: "🐛 버그 제보"
description: "오류 또는 예상과 다르게 동작하는 문제를 보고합니다."
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 오류 내용
      description: 어떤 문제가 발생했나요?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 오류가 발생하는 순서를 단계별로 작성해주세요.
      placeholder: |
        1. 페이지에 접속합니다.
        2. 메뉴를 클릭합니다.
        3. 오류가 발생합니다.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
      description: 원래 어떻게 동작해야 하나요?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 실제로 어떤 일이 발생하나요?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 스크린샷 또는 오류 메시지(선택)
      description: 문제가 보이는 화면이나 콘솔 오류를 첨부해주세요.
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: 환경(선택)
      placeholder: 예) macOS, Chrome 최신 버전, 모바일 Safari
    validations:
      required: false
